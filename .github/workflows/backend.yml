name: Backend checks
on:
  push:
    paths: ["server/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      POSTGRES_USER: aeo_test
      POSTGRES_PASSWORD: ci_test_database_only
      POSTGRES_DB: aeo_test
      DATABASE_URL: postgresql://aeo_test:ci_test_database_only@localhost:5432/aeo_test
      REDIS_URL: redis://localhost:6379
      MINIO_ROOT_USER: ci_storage
      MINIO_ROOT_PASSWORD: ci_storage_test_only
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ci-unused-default
      S3_ACCESS_KEY_ID: ci_storage
      S3_SECRET_ACCESS_KEY: ci_storage_test_only
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: docker compose up -d --wait --wait-timeout 90
      - name: Wait for object storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm run db:migrate
      - run: npm run test:integration
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop disposable CI infrastructure
        if: always()
        run: docker compose down
